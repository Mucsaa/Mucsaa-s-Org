<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="polarisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#181512" />
  <!-- Outer Glow Halo -->
  <circle cx="256" cy="256" r="180" fill="url(#polarisGrad)" opacity="0.25" filter="url(#glow)" />
  
  <!-- Main Star Shape -->
  <path d="M256 64 C256 160 300 210 396 256 C300 302 256 352 256 448 C256 352 212 302 116 256 C212 210 256 160 256 64 Z" fill="url(#polarisGrad)" />
  
  <!-- Cute Mascot Eyes -->
  <ellipse cx="220" cy="246" rx="14" ry="20" fill="#181512" />
  <circle cx="224" cy="240" r="5" fill="#FFFFFF" />
  
  <ellipse cx="292" cy="246" rx="14" ry="20" fill="#181512" />
  <circle cx="296" cy="240" r="5" fill="#FFFFFF" />
  
  <!-- Blush -->
  <ellipse cx="198" cy="265" rx="12" ry="7" fill="#FCA5A5" opacity="0.8" />
  <ellipse cx="314" cy="265" rx="12" ry="7" fill="#FCA5A5" opacity="0.8" />
  
  <!-- Smile -->
  <path d="M242 268 Q256 278 270 268" stroke="#181512" stroke-width="4.5" stroke-linecap="round" fill="none" />
  
  <!-- Sparkles -->
  <circle cx="370" cy="140" r="12" fill="#FDE047" />
  <circle cx="140" cy="360" r="8" fill="#FDE047" />
</svg>
